name: CI

on:
  pull_request:
  push:
    paths-ignore:
    - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        emacs_version:
          - 28.1
          - 28.2
          - 29.1
          - 29.3
          - 29.4
          - 30.1
          - 30.2
        experimental: [false]
        include:
          - emacs_version: snapshot
            experimental: true
    steps:
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}

    - uses: actions/checkout@v7
    - name: Offline portability checks
      run: emacs -Q --batch -l tests/init-portability-test.el -f ert-run-tests-batch-and-exit
    - name: Check startup
      run: ./test-startup.sh

  personal-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: jcs090218/setup-emacs@master
      with:
        version: '30.2'
    - name: Offline portability checks
      run: emacs -Q --batch -l tests/init-portability-test.el -f ert-run-tests-batch-and-exit
    - name: Restore local packages
      run: emacs -Q --batch -l scripts/bootstrap-local-packages.el -f sanityinc/bootstrap-local-packages
    - name: Check startup with personal packages
      run: emacs -Q --batch -l scripts/test-startup.el
